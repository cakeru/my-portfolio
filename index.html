<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Modified viewport for fixed desktop appearance on mobile -->
    <meta name="viewport" content="width=1024, user-scalable=yes" />
    <title>Chhousour Leok's Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS Configuration (adjust as needed for custom themes/animations) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ['Inter', 'sans-serif'],
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'bounce-scroll': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.7s ease-out forwards',
              'bounce-scroll': 'bounce-scroll 1.5s infinite ease-in-out',
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script> <!-- Or main.js if you chose JavaScript variant -->
  </body>
</html>
